name: Phase 0 validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "rules/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/phase0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run complete Phase 0 technical checks
        run: python scripts/check_phase0.py
