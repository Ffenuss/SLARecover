name: Phase 0 validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "rules/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/phase0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate Phase 0 repository invariants and rule contracts
        run: python scripts/validate_phase0.py

      - name: Test Phase 0 validator
        run: python -m unittest discover -s tests -p "test_*.py"
